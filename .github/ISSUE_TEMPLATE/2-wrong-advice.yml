name: Wrong, outdated or risky advice
description: Something in a skill is incorrect, out of date, or could lead to a privacy or validity problem.
labels: [correction]
body:
  - type: input
    id: location
    attributes:
      label: Where
      placeholder: e.g. references/privacy_boundary.md, section 4
    validations: {required: true}
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
    validations: {required: true}
  - type: textarea
    id: source
    attributes:
      label: Source or evidence
      description: Regulation, guideline, documentation or paper that supports the correction. Links please.
  - type: textarea
    id: fix
    attributes:
      label: Suggested wording
